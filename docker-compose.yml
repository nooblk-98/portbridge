services:
  wg-forwarder:
    build: .
    environment:
      WG_HOST: ${WG_HOST:?Set WG_HOST to your public hostname or IP}
      # Set ADMIN_PASSWORD, or ADMIN_PASSWORD_HASH to avoid storing the password.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH:-}
    ports:
      - "51820:51820/udp" # WireGuard
      - "127.0.0.1:3000:3000/tcp" # Dashboard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      net.ipv4.ip_forward: "1"
      net.ipv4.conf.all.src_valid_mark: "1"
    volumes:
      - wg-data:/data
      - /lib/modules:/lib/modules:ro
    restart: unless-stopped

volumes:
  wg-data:
