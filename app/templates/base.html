<!DOCTYPE html>
<html lang="en" class="scroll-smooth">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="light dark">
    <script src="{{ url_for('static', filename='js/theme.js') }}"></script>
    <!-- Read by updates.js to look for a newer release. -->
    <meta name="portbridge-version" content="{{ app_version }}">
    <meta name="portbridge-update-check" content="{{ 'on' if update_check else 'off' }}">
    <title>WireGuard Manager</title>
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='img/logo.png') }}">

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

    <!-- Tailwind CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/tailwind.css') }}">

    <!-- Alpine.js -->
    <script defer src="{{ url_for('static', filename='vendor/alpine-3.14.9.min.js') }}"></script>
</head>

<body
    class="bg-gray-50 text-slate-800 dark:bg-dark-bg dark:text-slate-200 font-sans antialiased transition-colors duration-300"
    x-data="app()" x-init="initApp()" :class="{ 'dark': isDarkMode }">

    {% include "components/background.html" %}

    {% block content %}
    {% endblock %}

    <script src="{{ url_for('static', filename='vendor/dicebear-avataaars.min.js') }}"></script>
    <script src="{{ url_for('static', filename='vendor/chart-line.min.js') }}"></script>
    <script src="{{ url_for('static', filename='js/tones.js') }}"></script>
    <script src="{{ url_for('static', filename='js/updates.js') }}"></script>
    <script src="{{ url_for('static', filename='js/route-access.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/shell.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/dashboard.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/clients.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/peer-settings.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/routes.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/forwarding.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app/update-notice.js') }}"></script>
    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>

</html>
