<button type="button" @click="logout()" :disabled="loading.logout"
    class="mt-2 w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-red-600 hover:bg-red-50 dark:hover:bg-red-900/20 transition-colors text-sm font-medium disabled:opacity-70">
    <span class="material-symbols-rounded text-lg" aria-hidden="true">logout</span>
    <span>Sign Out</span>
</button>
<div class="p-4 border-t border-gray-200 dark:border-dark-border text-center">
    <button type="button" @click="toggleTheme()"
        class="w-full flex items-center justify-center gap-2 px-4 py-2 rounded-lg border border-gray-200 dark:border-dark-border text-slate-600 dark:text-slate-400 hover:bg-gray-100 dark:hover:bg-slate-800 transition-colors text-sm font-medium">
        <span class="material-symbols-rounded text-lg" aria-hidden="true"
            x-text="isDarkMode ? 'light_mode' : 'dark_mode'"></span>
        <span x-text="isDarkMode ? 'Light Mode' : 'Dark Mode'"></span>
    </button>
    {% if show_app_footer %}
    <p class="app-footer">
        <a href="{{ repo_url }}" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span aria-hidden="true">&middot;</span>
        <a href="{{ repo_url }}/releases" target="_blank" rel="noopener noreferrer">v{{ app_version }}</a>
    </p>
    {% endif %}
</div>
