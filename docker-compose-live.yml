services:
  wg-forwarder:
    image: lahiru98s/portbridge:latest
    container_name: portbridge

    environment:
      WG_HOST: ${WG_HOST:?Set WG_HOST to your public hostname or IP}
      WG_PORT: 51820
      WG_NETWORK: 10.8.0.0/24
      WG_ADDRESS: 10.8.0.1/24
      APP_PORT: 3000
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD before starting PortBridge}

    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.ip_forward=1
      - net.ipv4.conf.all.src_valid_mark=1
    ports:
      - "51820:51820/udp"
      - "127.0.0.1:3000:3000/tcp"
      - "30000-30100:30000-30100/tcp"

    volumes:
      - wg-data:/data
      - /lib/modules:/lib/modules:ro

    restart: unless-stopped

volumes:
  wg-data:
