[package]
name = "portbridge"
version = "0.1.0"
edition = "2021"
description = "WireGuard VPN manager with dynamic port forwarding web UI"
license = "MIT"
publish = false

[lib]
doctest = false

[dependencies]
axum = "0.8"
base64 = "0.22"
hmac = "0.12"
ipnet = "2"
minijinja = "2"
png = "0.17"
qrcodegen = "1.8"
rand = "0.8"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
subtle = "2"
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["fs"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }
