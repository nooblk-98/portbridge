name: Verify

# Pushes to main are verified by the Release workflow, which calls this one
# before tagging, so main is not listed here.
on:
  pull_request:
  push:
    branches: [development]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install Rust components
        run: rustup component add rustfmt clippy
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Lint
        run: cargo clippy --all-targets --locked -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release binary
        run: cargo build --release --locked --bin portbridge

  container:
    name: Container build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --pull --tag portbridge:verify .
      - name: Check runtime image contents
        run: |
          docker run --rm --network none --entrypoint sh portbridge:verify -ec '
            test -x /usr/local/bin/portbridge
            test -f /app/app/templates/login.html
            test -f /app/app/static/js/app.js
            test -z "$(command -v python3)"
            test -z "$(command -v pip3)"
          '

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install build tooling
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Rebuild the stylesheet
        working-directory: frontend
        run: npm run build:css
      - name: Check the committed stylesheet is current
        run: git diff --exit-code -- app/static/css/tailwind.css

  e2e:
    name: Browser end-to-end tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Install test tooling
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Build the test server
        run: cargo build --locked --example e2e_server
      - name: Run the browser tests
        working-directory: frontend
        run: npx playwright test
      - name: Keep the report when tests fail
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: playwright-results
          path: frontend/test-results
          retention-days: 7

  installer:
    name: Installer and dashboard scripts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Check shell syntax
        run: bash -n install.sh
      - name: ShellCheck
        run: shellcheck --severity=warning install.sh
      - name: Check dashboard scripts
        run: |
          node --check app/static/js/app.js
          node --check app/static/js/login.js
          node --check app/static/js/route-access.js
          node --check app/static/js/theme.js
