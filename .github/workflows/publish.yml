name: Build and Push Docker Images

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to build (defaults to the latest release)
        required: false
        type: string
  repository_dispatch:
    types: [release-completed]

permissions:
  contents: read

# Builds push :latest, so run them one at a time and let the newest
# queued release win instead of racing an older build.
concurrency:
  group: docker-publish
  cancel-in-progress: false

env:
  DOCKERHUB: lahiru98s

jobs:
  get-release-tag:
    name: Resolve release tag
    runs-on: ubuntu-latest
    outputs:
      tag_name: ${{ steps.tag.outputs.tag }}
    steps:
      - name: Resolve and validate tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
          DISPATCH_TAG: ${{ github.event.client_payload.tag }}
        run: |
          set -euo pipefail
          tag=${RELEASE_TAG:-${INPUT_TAG:-${DISPATCH_TAG:-}}}
          if [[ -z $tag ]]; then
            tag=$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)
          fi
          if [[ ! $tag =~ ^v[0-9]+\.[0-9]+\.[0-9]+([-+][0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Unexpected release tag: $tag"
            exit 1
          fi
          echo "Release tag: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  build:
    runs-on: ubuntu-latest
    needs: get-release-tag
    permissions:
      contents: read
      packages: write
    steps:
      # Build the tagged commit, not whatever main has moved on to.
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: refs/tags/${{ needs.get-release-tag.outputs.tag_name }}
          persist-credentials: false

      - name: Login to Docker Hub
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Build and push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            PORTBRIDGE_VERSION=${{ needs.get-release-tag.outputs.tag_name }}
          tags: |
            ${{ env.DOCKERHUB }}/portbridge:latest
            ${{ env.DOCKERHUB }}/portbridge:${{ needs.get-release-tag.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/portbridge:latest
            ghcr.io/${{ github.repository_owner }}/portbridge:${{ needs.get-release-tag.outputs.tag_name }}

  sync-dockerhub:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Sync Docker Hub README
        uses: bemble/sync-readme@dca6e726e15fcac65d44fad41bb066d4f64a7c54 # v1.0.0
        with:
          user: ${{ secrets.DOCKERHUB_USERNAME }}
          pass: ${{ secrets.DOCKERHUB_TOKEN }}
          slug: ${{ env.DOCKERHUB }}/portbridge
          readme: ./docker/description.md
          description: PortBridge
