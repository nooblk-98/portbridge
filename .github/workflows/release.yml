name: Release

# Every merge to main (a merged PR is a push to main) gets a new patch tag,
# static Linux binaries, and a published release marked as latest.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  tag:
    name: Tag and draft release
    runs-on: ubuntu-latest
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump tag automatically
        id: tag
        uses: anothrNick/github-tag-action@1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main

      - name: Create draft release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          generate_release_notes: true
          draft: true

  binaries:
    name: Build release binaries
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}

  publish:
    name: Publish release
    needs: [tag, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Events created with GITHUB_TOKEN do not start other workflows, so ask
      # the Docker publish workflow to run explicitly.
      - name: Request Docker image build
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api "repos/$GITHUB_REPOSITORY/dispatches" -f event_type=release-completed
