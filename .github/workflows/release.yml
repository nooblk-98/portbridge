name: Release

# Every code change merged to main (a merged PR is a push to main) is verified,
# given a new patch tag, built into static Linux binaries, and published as the
# latest release. Documentation-only pushes do not release.
on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "images/**"
      - "LICENSE"
      - ".agents/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  verify:
    name: Verify
    uses: ./.github/workflows/verify.yml

  tag:
    name: Tag and draft release
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      new_tag: ${{ steps.tag.outputs.new_tag }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Bump tag automatically
        id: tag
        uses: anothrNick/github-tag-action@f278d49d30cdd8775cc3e7dd00b5ee11686ee297 # 1.71.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEFAULT_BUMP: patch
          WITH_V: true
          RELEASE_BRANCHES: main

      # Pushes go straight to main, so GitHub's generated notes (which list pull
      # requests) would be empty. Use the matching CHANGELOG.md section when there
      # is one, otherwise list the commits since the previous release.
      - name: Compose release notes
        if: steps.tag.outputs.new_tag != ''
        env:
          NEW_TAG: ${{ steps.tag.outputs.new_tag }}
        run: |
          set -euo pipefail
          git fetch --tags --force --quiet
          version=${NEW_TAG#v}
          prev=$(git describe --tags --abbrev=0 "${NEW_TAG}^" 2>/dev/null || true)
          awk -v v="$version" '
            index($0, "## [" v "]") == 1 { found = 1; next }
            index($0, "## [") == 1 { found = 0 }
            found
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            range=${prev:+$prev..}$NEW_TAG
            {
              echo "## What's changed"
              echo
              git log "$range" --no-merges --pretty='- %s (%h)' \
                | sed -E 's/ *#(major|minor|patch|none)\b//g'
            } > release-notes.md
          fi
          {
            echo
            echo "### Install or upgrade"
            echo
            echo '```sh'
            echo "curl -fsSL https://raw.githubusercontent.com/$GITHUB_REPOSITORY/main/install.sh | sudo bash -s -- --upgrade"
            echo '```'
            if [[ -n $prev ]]; then
              echo
              echo "**Full changelog**: https://github.com/$GITHUB_REPOSITORY/compare/$prev...$NEW_TAG"
            fi
          } >> release-notes.md

      - name: Create draft release
        if: steps.tag.outputs.new_tag != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ steps.tag.outputs.new_tag }}
          body_path: release-notes.md
          draft: true

  binaries:
    name: Build release binaries
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: write
    uses: ./.github/workflows/release-binaries.yml
    with:
      tag: ${{ needs.tag.outputs.new_tag }}

  demo:
    name: Deploy the live demo
    needs: tag
    if: needs.tag.outputs.new_tag != ''
    permissions:
      contents: read
    uses: ./.github/workflows/demo.yml
    with:
      version: ${{ needs.tag.outputs.new_tag }}
    secrets:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  publish:
    name: Publish release
    needs: [tag, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release as latest
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest

      # Events created with GITHUB_TOKEN do not start other workflows, so ask
      # the Docker publish workflow to run explicitly, for this exact tag.
      - name: Request Docker image build
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.tag.outputs.new_tag }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/dispatches" \
            -f event_type=release-completed \
            -f "client_payload[tag]=$TAG"
